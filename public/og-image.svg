<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Glow -->
  <circle cx="200" cy="150" r="280" fill="#f59e0b" opacity="0.15" filter="blur(60px)" />
  <circle cx="1000" cy="480" r="260" fill="#f59e0b" opacity="0.1" filter="blur(60px)" />

  <!-- Main Content Container -->
  <g transform="translate(100, 110)">
    <!-- Logo Badge -->
    <rect width="90" height="90" rx="24" fill="url(#amberGrad)" />
    <g fill="#ffffff" transform="translate(22, 22) scale(0.18)">
      <path d="M128 0 L240 64 L240 192 L128 256 L16 192 L16 64 Z" stroke="#fff" stroke-width="18" fill="none"/>
      <path d="M16 64 L128 128 L240 64" stroke="#fff" stroke-width="18" fill="none"/>
      <line x1="128" y1="128" x2="128" y2="256" stroke="#fff" stroke-width="18"/>
    </g>

    <text x="115" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Paketshop<tspan fill="#fbbf24">.uz</tspan>
    </text>

    <!-- Subtitle / AI badge -->
    <rect x="0" y="125" width="220" height="38" rx="19" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="18" y="149" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#fbbf24">
      ✨ MALIKA AI YORDAMCHI
    </text>

    <!-- Headline -->
    <text x="0" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
      Aqlli va Samimiy Savdo
    </text>
    <text x="0" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="900" fill="#fbbf24" letter-spacing="-1.5">
      Konsultanti
    </text>

    <!-- Description -->
    <text x="0" y="355" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
      Ovozli va yozma suhbat orqali mahsulotlarni tanlang va bir zumda buyurtma bering.
    </text>

    <!-- Feature pills -->
    <g transform="translate(0, 395)">
      <!-- Pill 1 -->
      <rect width="180" height="42" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1" />
      <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">
        🎙️ Ovozli xarid
      </text>

      <!-- Pill 2 -->
      <rect x="195" width="210" height="42" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1" />
      <text x="215" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">
        ⚡ Tezkor buyurtma
      </text>

      <!-- Pill 3 -->
      <rect x="420" width="220" height="42" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1" />
      <text x="440" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">
        🤖 24/7 Doimiy xizmat
      </text>
    </g>
  </g>
</svg>
